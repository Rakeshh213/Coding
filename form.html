<body>
    <h1>STUDENT'S REGISTRATION FORM</h1>
    <hr>
    <p>Please fill out the form</p>
    <form>
        
        <label for="Name">First Name:</label>
        <input type="text" name="Username" id="Name" placeholder="eg:Mishkat" required>

        <br><br>


        <label for="Name">Last Name:</label>
        <input type="text" name="Username" id="Name" placeholder="eg:Begum"required>

        <br><br>

          
        <label for="Email">Email:</label>
        <input type="email" name="Email" id="Email" required>

        <br><br>

        <label for="Password">Password:</label>
       <input type="password" name="User password" id="Password" required>

        
       <br><br>

       <label for="Phone">Phone:</label>
        <input type="tel" name="Phone" id="Phone">

        <br><br>
        <label for="Male">Male</label>
        <input type="radio" name="Gender" id="Male" value="Male" required>
        <br><br>
       
        <label for="Female">Female</label>
        <input type="radio" name="Gender" id="Female" value="Female" required >
         <br><br>

        <label for="Other">Other</label>
        <input type="radio" name="Gender" id="Other" value="Other">
        <br><br>

    
        <label for="DOB">Date of Birth:</label>
        <input type="date" name="DOB" id="DOB">

        <Br></Br>
        

        <label for="course">Select Course</label>
        <select name="Course" id="Course">
        <option value="BCA">BCA</option>
        <option value="MCA">MCA</option>
        <option value="BBA">BBA</option>
        <option value="MBA">MBA</option>
        <option value="BTech">BTech</option>
        </select>


    <br><br>
    
        <label for="HTML">Html</label>
        <input type="checkbox">

        <label for="CSS">Css</label>
        <input type="checkbox" id="CSS">

        <label for="JS">Java Script</label>
        <input type="checkbox" id="JS">

        <label for="PYTHON">Python</label>
        <input type="checkbox" id="PYTHON">

        <br><br>

        
        <Label for="ADDRESS">Address</Label>
        <br>
          <Textarea name="address" id="ADDRESS" rows="10" cols="20" placeholder="Pin/City/District"></Textarea>
        <br><br>
       
        <p>Please Upload Your Photo:</p>
        <input type="file">
        <br><br>
        <hr>

        <h2>Creat Your Account</h2>

        <label for="Password">Password:</label>
        <input type="password" name="Password" id="Password">

        <br><br>

        <label for="Question">Security Question:</label>
        <select name="Question" id="Question">
        <option value="What is your pet's name?">your close friend's name?</option>
        <option value="What is your pet's name?">your favourite food?</option>
           <br></br>
        

        <label for="Answer">Security Answer:</label>
        <input type="text" name="Answer" id="security answer" placeholder="eg:  Mishkat">
         
        <br><br>

        <label for="Conditions">I agree to the terms and conditions:</label>
        <input type="checkbox" name="Conditions" id="Conditions">
            <hr>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        
        
    
    
    
    
    
    </form>
