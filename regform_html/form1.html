<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./form.css">
</head>
<body>
    <h1>Fees Registration form</h1>
<div class="container">
    
    <label for="Name">Student Name:</label>
        <input type="text" name="Username" id="Name"  required>
        <br><br>

        <label for="number">Phone:</label>
        <input type="tel" name="Usernumber" id="Name"  required>
        <br><br>

        <label for="email">Mail</label>
        <input type="email" name="usermail" id="usermail" required>
         
        <br><br>
        <label for="DOB">Date of Birth:</label>
        <input type="date" name="DOB" id="DOB">

         <br><br>
        <label for="course">Select Course</label>
        <select name="Course" id="Course">
        <option value="BCA">BCA</option>
        <option value="MCA">MCA</option>
        <option value="BBA">BBA</option>
        <option value="MBA">MBA</option>
        <option value="BTech">BTech</option>
        <option value="Bsc">Bsc</option>
        <option value="Msc">Msc</option>        
    </select>
    <br><br>
    <label for="Fees">Fees details</label>
    <input type="number"  name="userfees" id="fees" required>
        </div>
    <br><br>
        <button>   Submit</button>
</body>
</html>
